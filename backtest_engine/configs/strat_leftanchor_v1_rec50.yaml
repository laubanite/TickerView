# AlphaPrism anchor 速验 · 敏感性:回撤修复 50% 止盈(其他全同)
# anchor_take → recovery_pct 50:收盘 ≥ 峰值 − 50%×(峰值−入场收盘)(均值回归目标,
# 峰值/入场收盘记录于 entry 信号日,state.anchor_peak/anchor_entry_close)。
name: leftanchor_v1_rec50

accounts:
  full_cash: 100000
  full_allocation: 1.0

layers:
  anchor: 3.0

indicators:
  - {id: m_20,  type: sma, params: {period: 20}}
  - {id: kdj_k, type: stoch_k, params: {}}
  - {id: kdj_d, type: stoch_d, params: {}}

series:
  vol20:            {type: rolling_mean, source: volume, lookback: 20}
  peak120:          {type: rolling_max, source: close, lookback: 120, min_periods: 30}
  prev_close:       {type: shift, source: close, n: 1}
  prev_close2:      {type: shift, source: close, n: 2}

signals:
  - id: anchor_timeout
    type: hold_days_ge
    days: 20
    action: {sell: clear_anchor}

  - id: anchor_stop
    type: close_below_cost
    multiplier: 0.92
    action: {sell: clear_anchor}

  - id: anchor_take          # ← 变体:站回 M20 → 回撤修复 50%
    type: recovery_pct
    pct: 50
    action: {sell: clear_anchor}

  - id: anchor_entry
    type: and
    conds:
      - {type: layers_empty, layers: [anchor]}
      - {type: j_below, threshold: 10}
      - {type: drawdown_above, ref: peak120, threshold: 15.0}
      - type: or
        conds:
          - type: and
            conds:
              - {type: pct_drop, threshold: 3.0}
              - {type: vol_ratio_above, ref: vol20, threshold: 1.5}
          - {type: consecutive_down, n: 2}
    action: {buy: anchor, pct_of_full: 3.0}